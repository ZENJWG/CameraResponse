; GTASA: Camera Response plugin created by Zeneric and inspired by the camera feel of MachineGames titles.
; Preset: Subtle, Default, Heavy, MachineGames, Comfort
; Subtle: Low-fatigue response with reduced ambient motion, FOV and rotation while keeping impacts readable.
; Default: Balanced all-round tuning with moderate movement, combat, vehicle and environmental response.
; Heavy: Stronger physical displacement, recoil, melee, landings and vehicle weight with slower recovery.
; MachineGames: Punchy combat and impact response, restrained ambient motion, brisk recovery and stronger FOV/rotation.
; Comfort: Minimizes persistent ambient movement and greatly reduces FOV/rotation while preserving discrete impacts, recoil, melee and landings.

